name: 급식·시간표 업데이트

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 20 * * *"   # 매일 한국시간 새벽 5시 17분
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 사이트 파일 준비
        run: |
          mkdir -p _site
          cp index.html faq.json logo.png _site/

      - name: 나이스에서 급식·시간표 받기
        env:
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
        run: python scripts/update.py _site/data.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
